[project]
name = "knowledge-base"
version = "0.1.0"
description = "Milvus-backed knowledge base service with multi-format ingestion and vector search APIs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alibabacloud-docmind-api20220711>=1.0.0",
    "alibabacloud-tea-openapi>=0.3.12",
    "alibabacloud-tea-util>=0.3.13",
    "dashscope>=1.25.16",
    "fastapi>=0.115.0,<1.0.0",
    "langchain-text-splitters>=1.1.1",
    "markitdown[docx,pdf]>=0.1.1",
    "milvus-lite==2.5.1",
    "numpy>=2.4.4",
    "openpyxl>=3.1.5,<4.0.0",
    "oss2>=2.19.1",
    "pdfplumber>=0.11.9",
    "playwright>=1.55.0,<2.0.0",
    "pypinyin>=0.53.0",
    "pymilvus[milvus-lite]==2.6.11",
    "pymysql>=1.1.2",
    "python-multipart>=0.0.9,<1.0.0",
    "requests>=2.32.0,<3.0.0",
    "setuptools<70",
    "uvicorn[standard]>=0.34.0,<1.0.0",
    "xlrd>=2.0.1,<3.0.0",
    "qdrant-client>=1.15.0,<2.0.0",
]

[project.scripts]
knowledge-base-api = "main:main"
knowledge-base-db-migrate = "knowledge_base.infrastructure.db_migrate:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
